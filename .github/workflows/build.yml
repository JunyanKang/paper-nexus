name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_release.py
      - run: npm test
      - name: JavaScript syntax
        run: python scripts/check_syntax.py
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: paper-nexus-${{ matrix.os }}
          path: |
            dist/*.xpi
            dist/updates.json
            dist/SHA256SUMS.txt
