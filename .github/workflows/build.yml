name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_release.py
      - run: npm test
      - name: JavaScript syntax
        run: python scripts/check_syntax.py
      - run: python scripts/build.py
      - name: Validate release package
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: paper-nexus-xpi
          path: dist/paper-nexus-*.xpi
          if-no-files-found: error
