name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - name: JavaScript syntax
        run: for file in addon/*.js; do node --check "$file"; done
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: paper-nexus
          path: |
            dist/*.xpi
            dist/updates.json
            dist/SHA256SUMS.txt
